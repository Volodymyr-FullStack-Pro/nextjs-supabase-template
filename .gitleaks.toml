# Настройки gitleaks: стандартные правила плюс исключения для примеров.
title = "nextjs-supabase-template"

[extend]
useDefault = true

[[allowlists]]
description = "Образцы и фикстуры без настоящих секретов"
paths = [
  '''\.env\.example$''',
  '''supabase/tests/.*\.sql$''',
  '''package-lock\.json$''',
]

[[allowlists]]
description = "Значение не секрет: бывшая константа теста планового маршрута, осталась в истории ветки (сейчас создаётся при запуске теста)"
regexes = ['''scheduler-secret-0123456789abcdef''']

name: Database

on:
  pull_request:
    paths:
      - 'supabase/**'
      - 'src/shared/infrastructure/supabase/types.ts'
      - '.github/workflows/db.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'src/shared/infrastructure/supabase/types.ts'

permissions:
  contents: read

jobs:
  rls:
    name: Advisors and pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 3.0.0 # та же версия, что на машинах разработчиков (supabase --version); обновлять вместе
      # Слитая миграция уже выложена на staging: правка или удаление разведут базу и историю миграций.
      - name: Merged migrations are not changed
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          changed=$(git diff --name-only --diff-filter=MDR "$BASE_SHA" HEAD -- supabase/migrations)
          if [ -n "$changed" ]; then
            echo "::error::Миграции из main не меняют и не удаляют — исправление новой миграцией вперёд (docs/release.md):"
            printf '%s\n' "$changed"
            exit 1
          fi
      - name: Start local Supabase (applies supabase/migrations)
        run: supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector
      - name: Security and performance advisors
        run: supabase db advisors --fail-on warn # без флага команда всегда завершается успешно
      - name: Database functions compile (plpgsql_check)
        run: supabase db lint --fail-on warning
      - name: pgTAP
        run: supabase test db
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Новые миграции — без операций, опасных для живой базы (блокировки без lock_timeout, удаление колонок, int вместо bigint)
      - name: Migration safety (Squawk)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: npm run db:check-migrations -- "$BASE_SHA"
      - name: Database types match the migrations
        run: |
          npm run db:types
          git diff --exit-code -- src/shared/infrastructure/supabase/types.ts || {
            echo "::error file=src/shared/infrastructure/supabase/types.ts::Типы устарели: supabase start, npm run db:types и закоммитить файл"
            exit 1
          }
      - if: always()
        run: supabase stop

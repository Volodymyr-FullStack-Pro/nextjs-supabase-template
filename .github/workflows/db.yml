name: Database

on:
  pull_request:
    paths:
      - 'supabase/**'
      - 'src/shared/infrastructure/supabase/types.ts'
      - '.github/workflows/db.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'src/shared/infrastructure/supabase/types.ts'

permissions:
  contents: read

jobs:
  rls:
    name: Advisors and pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A PR needs its base commit here: no token is left for a later git fetch. Strings, because a bare 0 is falsy in && ||.
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 3.0.0 # same as developer machines (supabase --version); update together
      # A merged migration is already on staging: editing or deleting it diverges the database from its migration history.
      - name: Merged migrations are not changed
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=$(git diff --name-only --diff-filter=MDR "$BASE_SHA" HEAD -- supabase/migrations)
          if [ -n "$changed" ]; then
            echo "::error::Migrations from main are not edited or deleted; fix forward with a new migration (docs/release.md):"
            printf '%s\n' "$changed"
            exit 1
          fi
      - name: Start local Supabase (applies supabase/migrations)
        run: supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector
      - name: Security and performance advisors
        run: supabase db advisors --fail-on warn # without the flag the command always succeeds
      - name: Database functions compile (plpgsql_check)
        run: supabase db lint --fail-on warning
      - name: pgTAP
        run: supabase test db
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Migration safety (Squawk)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: npm run db:check-migrations -- "$BASE_SHA"
      - name: Database types match the migrations
        run: |
          npm run db:types
          git diff --exit-code -- src/shared/infrastructure/supabase/types.ts || {
            echo "::error file=src/shared/infrastructure/supabase/types.ts::Types are stale: run supabase start and npm run db:types, then commit the file"
            exit 1
          }
      - if: always()
        run: supabase stop

name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: '0 3 * * 1' # weekly perf run on main catches slow regressions

concurrency:
  # the scheduled run has its own group: otherwise it queues behind main and cancels a pending push run
  group: ci-${{ github.event_name == 'schedule' && 'schedule' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Third-party actions are pinned to a commit SHA (tag in the comment); Dependabot updates them monthly.
jobs:
  quality:
    name: Lint, types, unit, dead code, build
    if: github.event_name != 'schedule' # the weekly run is Playwright and perf only
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit signatures
      - run: npm audit --omit=dev --audit-level=high # dev dependencies are covered by Dependabot
      - run: npm run licenses
      - run: npm run lint
      - run: npm run lint:rules
      - run: npm run typecheck
      - run: npm run req:check
      - run: npm run docs:check
      - run: npm run comments:check
      - run: npm run test:coverage
      - run: npm run knip
      - run: npm run jscpd
      - run: npm run format:check
      - run: npm run build
      - run: npm run budget

  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 3.0.0 # same as db.yml and developer machines
      - name: Start local Supabase (Postgres, Auth, REST)
        run: supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,realtime,storage-api,postgres-meta,supavisor
      - run: npm ci
      # The cache holds only browsers (apt packages are not cached), so the install command stays the same
      # and skips the download on a cache hit.
      - name: Playwright browsers cache key
        id: playwright
        run: |
          . /etc/os-release
          version=$(node -p "require('@playwright/test/package.json').version")
          echo "key=playwright-$ID$VERSION_ID-$(uname -m)-$version-chromium-webkit" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright.outputs.key }}
      - run: npx playwright install --with-deps chromium webkit
        timeout-minutes: 8 # usually 2–3 minutes; apt retries on network failures until the job timeout
      - name: Playwright with the local database
        run: npm run test:e2e:db
        env:
          CI: 'true'
      # Perf (tests/perf) only at checkpoints: push to main, a PR out of draft and the weekly run.
      # It reuses the e2e build (CI=true); thresholds are in tests/perf/pages.ts.
      - name: Speed budget
        if: github.event_name != 'pull_request' || !github.event.pull_request.draft
        run: npm run perf
        env:
          CI: 'true'
      # Generator templates (scripts/module-template) are outside lint and tsc: build a module from them, run every
      # check and remove it. Runs last because it rebuilds .next; checkpoints only, like perf.
      - name: Generated module passes every gate
        if: github.event_name != 'schedule' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
        run: npm run generator:check
        env:
          CI: 'true'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  security:
    name: Secrets
    if: github.event_name != 'schedule' # the weekly run is Playwright and perf only
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # gitleaks binary (MIT) instead of gitleaks-action, which needs a license key for organizations.
    # Version and archive SHA-256 from the release page (gitleaks_<version>_checksums.txt); update by hand,
    # Dependabot does not see this step.
    # actionlint checks the workflows the same way: version and SHA-256 from actionlint_<version>_checksums.txt.
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history: a secret in any commit stays there forever
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL --retry 3 -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
      - name: gitleaks
        run: ./gitleaks git --redact --no-banner --exit-code 1 .
      - name: Install actionlint
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL --retry 3 -o "$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" actionlint
      - name: actionlint
        run: ./actionlint -color # also runs shellcheck, preinstalled on the runner, on every run script

  semgrep:
    name: Semgrep
    if: github.event_name != 'schedule' # the weekly run is Playwright and perf only
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # semgrep-action is archived; the official way is the CLI in a container, pinned by digest.
    container:
      image: semgrep/semgrep:1.182.1@sha256:451b3d875c00dac7ed5db5293e584a07de11449a409c10b3c2d2652f429630b6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: semgrep scan --config p/nextjs --config p/typescript --config p/react --error --metrics=off

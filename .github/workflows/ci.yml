name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }} # прогоны main доходят до конца

permissions:
  contents: read

# Сторонние actions закреплены на commit SHA (тег — в комментарии); Dependabot обновляет их раз в месяц.
jobs:
  quality:
    name: Lint, types, unit, dead code, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit signatures # подписи и provenance пакетов из реестра
      - run: npm audit --omit=dev --audit-level=high # production-зависимости без известных уязвимостей; dev — через Dependabot
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run req:check
      - run: npm run test:coverage
      - run: npm run knip
      - run: npm run jscpd
      - run: npm run format:check
      - run: npm run build
      - run: npm run budget

  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 3.0.0 # как в db.yml и на машинах разработчиков
      - name: Start local Supabase (Postgres, Auth, REST)
        run: supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,realtime,storage-api,postgres-meta,supavisor
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Playwright with the local database
        run: npm run test:e2e:db # адрес и ключи берёт из supabase status, сценарии за входом не пропускаются
        env:
          CI: 'true'
      - name: Lighthouse budget
        run: npm run perf # production-сборка уже сделана webServer Playwright
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  security:
    name: Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read # gitleaks читает коммиты PR через API; без этого 403 на любом pull_request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false' # токен PR от Dependabot только на чтение
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }} # для репозитория организации обязателен (бесплатный ключ gitleaks.io), для личного — пустой

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # semgrep/semgrep-action заархивирован; официальный путь — CLI в контейнере. Образ закреплён на digest.
    container:
      image: semgrep/semgrep:1.182.1@sha256:451b3d875c00dac7ed5db5293e584a07de11449a409c10b3c2d2652f429630b6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: semgrep scan --config p/nextjs --config p/typescript --config p/react --error --metrics=off

name: Deploy database

# Миграции и настройки Auth из supabase/config.toml: main → staging, production → production (docs/release.md).
on:
  push:
    branches: [main, production]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-db.yml'
  workflow_dispatch: # повторить выкладку вручную (Actions → Deploy database → ветка main или production)

permissions:
  contents: read

concurrency:
  group: deploy-db-${{ github.ref }}
  cancel-in-progress: false # миграцию не обрываем на середине

jobs:
  deploy:
    name: Supabase ${{ github.ref == 'refs/heads/production' && 'production' || 'staging' }}
    # В самом шаблоне (репозиторий-шаблон) не запускается; в проекте — только из веток main и production.
    # Сравнивается полный ref: короткое имя у тега «main» или «production» то же, что у ветки, а ручной запуск
    # (workflow_dispatch) можно начать и с тега — с произвольного коммита.
    if: ${{ !github.event.repository.is_template && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Секреты и переменные — в GitHub Environment; production принимает только ветку production. Подтверждение
    # выпуска — слияние PR main → production в защищённую ветку: required reviewers окружения на GitHub Team
    # в приватном репозитории нет (только публичный репозиторий или Enterprise).
    # Секрет получает только шаг, которому он нужен (env шага): сторонние actions — checkout, setup-cli — их не видят.
    environment: ${{ github.ref == 'refs/heads/production' && 'production' || 'staging' }}
    steps:
      - name: Check environment secrets
        id: secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          missing=""
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::warning::Выкладка базы пропущена: в окружении ${{ github.ref == 'refs/heads/production' && 'production' || 'staging' }} не заданы секреты:$missing (docs/release.md)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.secrets.outputs.ready == 'true'
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 3.0.0 # как в db.yml и на машинах разработчиков
      # Порт Postgres закрыт сетевыми ограничениями (SUPABASE_NETWORK_RESTRICTED=true). Эталон списка — переменная
      # окружения SUPABASE_DB_ALLOWED_CIDRS (CIDR через запятую; пусто — «Restrict all access»), а не то, что нашлось
      # в проекте: после оборванного запуска там может остаться адрес чужого раннера. Список проекта должен совпасть
      # с эталоном, иначе запуск останавливается. На время link и db push к эталону добавляется IP раннера,
      # потом ставится ровно эталон (шаг ниже, if: always()).
      - name: Open the database port for this runner
        id: network
        if: steps.secrets.outputs.ready == 'true' && vars.SUPABASE_NETWORK_RESTRICTED == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_ALLOWED_CIDRS: ${{ vars.SUPABASE_DB_ALLOWED_CIDRS }}
        run: |
          current="$RUNNER_TEMP/network-restrictions.json"
          reference="$RUNNER_TEMP/network-reference.json"
          jq -n --arg list "$SUPABASE_DB_ALLOWED_CIDRS" '
            [$list | gsub("\\s+"; ",") | split(",")[] | select(. != "")] as $cidrs
            | {
                dbAllowedCidrs: ($cidrs | map(select(contains(":") | not)) | unique),
                dbAllowedCidrsV6: ($cidrs | map(select(contains(":"))) | unique)
              }' > "$reference"
          if jq -e '
            [.dbAllowedCidrs[] | select(test("^[0-9]{1,3}(\\.[0-9]{1,3}){3}/[0-9]{1,2}$") | not)]
            + [.dbAllowedCidrsV6[] | select(test("^[0-9A-Fa-f:.]+/[0-9]{1,3}$") | not)]
            | length > 0' "$reference" > /dev/null; then
            echo "::error::Переменная SUPABASE_DB_ALLOWED_CIDRS: каждая запись — адрес с маской (например 203.0.113.7/32), записи через запятую"
            exit 1
          fi
          supabase network-restrictions get --remote="$SUPABASE_PROJECT_REF" --experimental -o json > "$current"
          jq -e '.config | type == "object"' "$current" > /dev/null
          # Переменная SUPABASE_NETWORK_RESTRICTED=true говорит «порт закрыт». Проект, где ограничения не применены
          # и список пуст, этому противоречит при любом эталоне: порт открыт всем либо список ещё применяется.
          # Идти дальше нельзя — выкладка прошла бы зелёной при открытом порте, а возврат к эталону не выполнился бы.
          if jq -e '.status != "applied" and ([.config.dbAllowedCidrs[]?, .config.dbAllowedCidrsV6[]?] | length == 0)' "$current" > /dev/null; then
            echo "::error::SUPABASE_NETWORK_RESTRICTED=true, но сетевые ограничения в проекте не применены и список пуст: порт базы открыт не по эталону. Примените эталон в Database → Network Restrictions (пустой эталон — «Restrict all access») и повторите запуск; если ограничения только что меняли — повторите через минуту; если порт должен быть открыт — снимите переменную SUPABASE_NETWORK_RESTRICTED."
            echo "В проекте: $(jq -c '{status, config}' "$current")"
            echo "Эталон:    $(jq -c . "$reference")"
            exit 1
          fi
          if ! jq -e --slurpfile reference "$reference" \
            '[.config.dbAllowedCidrs, .config.dbAllowedCidrsV6 | . // [] | unique] == [$reference[0].dbAllowedCidrs, $reference[0].dbAllowedCidrsV6]' \
            "$current" > /dev/null; then
            echo "::error::Список сетевых ограничений проекта не совпадает с эталоном SUPABASE_DB_ALLOWED_CIDRS. Проверьте Database → Network Restrictions: лишний адрес мог остаться после оборванной выкладки — уберите его в панели; если список меняли осознанно — обновите переменную окружения. Затем повторите запуск."
            echo "В проекте: $(jq -c '{dbAllowedCidrs: (.config.dbAllowedCidrs // [] | unique), dbAllowedCidrsV6: (.config.dbAllowedCidrsV6 // [] | unique)}' "$current")"
            echo "Эталон:    $(jq -c . "$reference")"
            exit 1
          fi
          ipv4='^[0-9]{1,3}(\.[0-9]{1,3}){3}$'
          first=$(curl -4 -fsS --max-time 10 --retry 2 https://api.ipify.org || true)
          second=$(curl -4 -fsS --max-time 10 --retry 2 https://checkip.amazonaws.com || true)
          if ! [[ "$first" =~ $ipv4 && "$second" =~ $ipv4 ]]; then
            echo "::error::Не удалось узнать IPv4 раннера: нужен ответ двух независимых сервисов (api.ipify.org и checkip.amazonaws.com). Повторите запуск."
            exit 1
          fi
          if [ "$first" != "$second" ]; then
            echo "::error::Сервисы назвали разные адреса раннера ($first и $second): порт базы не открываем. Повторите запуск."
            exit 1
          fi
          runner_ip="$first"
          echo "opened=true" >> "$GITHUB_OUTPUT"
          supabase network-restrictions update --remote="$SUPABASE_PROJECT_REF" --db-allow-cidr "$runner_ip/32" --append --experimental --yes
          for _ in $(seq 1 30); do
            supabase network-restrictions get --remote="$SUPABASE_PROJECT_REF" --experimental -o json \
              | jq -e --arg runner "$runner_ip/32" '.status == "applied" and ((.config.dbAllowedCidrs // []) | index($runner) != null)' > /dev/null && exit 0
            sleep 2
          done
          echo "::error::Supabase не применил временное правило за минуту (адреса раннера нет в применённом списке)"
          exit 1
      - name: Link project
        if: steps.secrets.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Apply migrations
        if: steps.secrets.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --yes --remote # CLI 3: без --remote команда идёт в локальную базу
      # Ставится ровно эталон (замена, не добавление) через Management API: update в CLI
      # требует хотя бы один --db-allow-cidr и не умеет вернуть пустой список («Restrict all access»).
      - name: Restore network restrictions
        if: always() && steps.network.outputs.opened == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          reference="$RUNNER_TEMP/network-reference.json"
          # Запрос ставит ровно эталон, поэтому повтор безопасен: при сбое сети адрес раннера не остаётся в списке.
          # Ответ пишет сам curl (-o): перед повтором он обнуляет файл, а через «>» два ответа склеились бы.
          curl -fsS --max-time 30 --retry 3 --retry-all-errors --retry-delay 2 \
            -o "$RUNNER_TEMP/network-restrictions-restored.json" \
            -X POST "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/network-restrictions/apply" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' \
            -d "$(jq -c . "$reference")"
          if ! jq -e --slurpfile reference "$reference" \
            '[.config.dbAllowedCidrs, .config.dbAllowedCidrsV6 | . // [] | unique] == [$reference[0].dbAllowedCidrs, $reference[0].dbAllowedCidrsV6]' \
            "$RUNNER_TEMP/network-restrictions-restored.json" > /dev/null; then
            echo "::error::Список сетевых ограничений не совпал с эталоном SUPABASE_DB_ALLOWED_CIDRS: проверьте Database → Network Restrictions"
            exit 1
          fi
          echo "Сетевые ограничения возвращены к эталону"
      - name: Push Auth and API settings
        if: steps.secrets.outputs.ready == 'true'
        # site_url и адреса возврата в config.toml — локальные; для облака их подменяет переменная окружения SITE_URL
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}
          ADDITIONAL_REDIRECT_URLS: ${{ vars.ADDITIONAL_REDIRECT_URLS }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "::error::Задайте переменную SITE_URL в окружении (адрес приложения, https://…): без неё в облако ушёл бы локальный site_url"
            exit 1
          fi
          SUPABASE_AUTH_SITE_URL="$SITE_URL" SUPABASE_AUTH_ADDITIONAL_REDIRECT_URLS="${ADDITIONAL_REDIRECT_URLS:-$SITE_URL}" supabase config push --yes

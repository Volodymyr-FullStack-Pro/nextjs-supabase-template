name: Deploy database

# Migrations and Auth settings from supabase/config.toml: main → staging, production → production (docs/release.md).
on:
  push:
    branches: [main, production]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-db.yml'
  workflow_dispatch: # rerun by hand: Actions → Deploy database → main or production

permissions:
  contents: read

concurrency:
  group: deploy-db-${{ github.ref }}
  cancel-in-progress: false # never cut a migration halfway

jobs:
  deploy:
    name: Supabase ${{ github.ref == 'refs/heads/production' && 'production' || 'staging' }}
    # Not in the template repository; here only from the main and production branches. Compare the full ref:
    # a tag named main or production has the same short name, and a manual run can start from a tag.
    if: ${{ !github.event.repository.is_template && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Secrets live in GitHub Environments; production accepts only the production branch. Approval is the merge
    # main → production: GitHub Team has no required environment reviewers in private repositories.
    # Secrets go only to the steps that need them (step env), so third-party actions never see them.
    environment: ${{ github.ref == 'refs/heads/production' && 'production' || 'staging' }}
    steps:
      - name: Check environment secrets
        id: secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          missing=""
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::warning::Database deploy skipped: the ${{ github.ref == 'refs/heads/production' && 'production' || 'staging' }} environment lacks secrets:$missing (docs/release.md)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.secrets.outputs.ready == 'true'
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 3.0.0 # same as db.yml and developer machines
      # The Postgres port is closed by network restrictions (SUPABASE_NETWORK_RESTRICTED=true). The reference list is
      # SUPABASE_DB_ALLOWED_CIDRS (comma-separated CIDRs; empty means "Restrict all access"), not the current project list,
      # which may keep a foreign runner address after an interrupted run. A mismatch stops the run. The runner IP is added
      # for link and db push, then the step below (if: always()) restores exactly the reference.
      - name: Open the database port for this runner
        id: network
        if: steps.secrets.outputs.ready == 'true' && vars.SUPABASE_NETWORK_RESTRICTED == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_ALLOWED_CIDRS: ${{ vars.SUPABASE_DB_ALLOWED_CIDRS }}
        run: |
          current="$RUNNER_TEMP/network-restrictions.json"
          reference="$RUNNER_TEMP/network-reference.json"
          jq -n --arg list "$SUPABASE_DB_ALLOWED_CIDRS" '
            [$list | gsub("\\s+"; ",") | split(",")[] | select(. != "")] as $cidrs
            | {
                dbAllowedCidrs: ($cidrs | map(select(contains(":") | not)) | unique),
                dbAllowedCidrsV6: ($cidrs | map(select(contains(":"))) | unique)
              }' > "$reference"
          if jq -e '
            [.dbAllowedCidrs[] | select(test("^[0-9]{1,3}(\\.[0-9]{1,3}){3}/[0-9]{1,2}$") | not)]
            + [.dbAllowedCidrsV6[] | select(test("^[0-9A-Fa-f:.]+/[0-9]{1,3}$") | not)]
            | length > 0' "$reference" > /dev/null; then
            echo "::error::SUPABASE_DB_ALLOWED_CIDRS: every entry is an address with a mask (e.g. 203.0.113.7/32), entries separated by commas"
            exit 1
          fi
          supabase network-restrictions get --remote="$SUPABASE_PROJECT_REF" --experimental -o json > "$current"
          jq -e '.config | type == "object"' "$current" > /dev/null
          # SUPABASE_NETWORK_RESTRICTED=true means the port is closed. Unapplied restrictions with an empty list contradict it
          # for any reference (the port is open or the list is still applying): going on would deploy green with an open port.
          if jq -e '.status != "applied" and ([.config.dbAllowedCidrs[]?, .config.dbAllowedCidrsV6[]?] | length == 0)' "$current" > /dev/null; then
            echo "::error::SUPABASE_NETWORK_RESTRICTED=true, but the project has no applied network restrictions and the list is empty: the database port is open, unlike the reference. Apply the reference in Database → Network Restrictions (an empty reference is 'Restrict all access') and rerun; if the restrictions were just changed, rerun in a minute; if the port must be open, remove the SUPABASE_NETWORK_RESTRICTED variable."
            echo "Project:   $(jq -c '{status, config}' "$current")"
            echo "Reference: $(jq -c . "$reference")"
            exit 1
          fi
          if ! jq -e --slurpfile reference "$reference" \
            '[.config.dbAllowedCidrs, .config.dbAllowedCidrsV6 | . // [] | unique] == [$reference[0].dbAllowedCidrs, $reference[0].dbAllowedCidrsV6]' \
            "$current" > /dev/null; then
            echo "::error::The project network restriction list does not match the SUPABASE_DB_ALLOWED_CIDRS reference. Check Database → Network Restrictions: an extra address may remain after an interrupted deploy, so remove it in the dashboard; if the list was changed on purpose, update the environment variable. Then rerun."
            echo "Project:   $(jq -c '{dbAllowedCidrs: (.config.dbAllowedCidrs // [] | unique), dbAllowedCidrsV6: (.config.dbAllowedCidrsV6 // [] | unique)}' "$current")"
            echo "Reference: $(jq -c . "$reference")"
            exit 1
          fi
          ipv4='^[0-9]{1,3}(\.[0-9]{1,3}){3}$'
          first=$(curl -4 -fsS --max-time 10 --retry 2 https://api.ipify.org || true)
          second=$(curl -4 -fsS --max-time 10 --retry 2 https://checkip.amazonaws.com || true)
          if ! [[ "$first" =~ $ipv4 && "$second" =~ $ipv4 ]]; then
            echo "::error::Could not get the runner IPv4: two independent services must answer (api.ipify.org and checkip.amazonaws.com). Rerun."
            exit 1
          fi
          if [ "$first" != "$second" ]; then
            echo "::error::The services returned different runner addresses ($first and $second): the database port stays closed. Rerun."
            exit 1
          fi
          runner_ip="$first"
          echo "opened=true" >> "$GITHUB_OUTPUT"
          supabase network-restrictions update --remote="$SUPABASE_PROJECT_REF" --db-allow-cidr "$runner_ip/32" --append --experimental --yes
          for _ in $(seq 1 30); do
            supabase network-restrictions get --remote="$SUPABASE_PROJECT_REF" --experimental -o json \
              | jq -e --arg runner "$runner_ip/32" '.status == "applied" and ((.config.dbAllowedCidrs // []) | index($runner) != null)' > /dev/null && exit 0
            sleep 2
          done
          echo "::error::Supabase did not apply the temporary rule within a minute (the runner address is not in the applied list)"
          exit 1
      - name: Link project
        if: steps.secrets.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Apply migrations
        if: steps.secrets.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --yes --remote # CLI 3: without --remote the command targets the local database
      # Set exactly the reference (replace, not add) through the Management API: the CLI update needs at least one
      # --db-allow-cidr and cannot restore an empty list ("Restrict all access").
      - name: Restore network restrictions
        if: always() && steps.network.outputs.opened == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          reference="$RUNNER_TEMP/network-reference.json"
          # Setting exactly the reference makes a retry safe. curl -o truncates the file before a retry; ">" would glue two responses.
          curl -fsS --max-time 30 --retry 3 --retry-all-errors --retry-delay 2 \
            -o "$RUNNER_TEMP/network-restrictions-restored.json" \
            -X POST "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/network-restrictions/apply" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' \
            -d "$(jq -c . "$reference")"
          if ! jq -e --slurpfile reference "$reference" \
            '[.config.dbAllowedCidrs, .config.dbAllowedCidrsV6 | . // [] | unique] == [$reference[0].dbAllowedCidrs, $reference[0].dbAllowedCidrsV6]' \
            "$RUNNER_TEMP/network-restrictions-restored.json" > /dev/null; then
            echo "::error::The network restriction list does not match the SUPABASE_DB_ALLOWED_CIDRS reference: check Database → Network Restrictions"
            exit 1
          fi
          echo "Network restrictions restored to the reference"
      - name: Push Auth and API settings
        if: steps.secrets.outputs.ready == 'true'
        # site_url and redirect URLs in config.toml are local; in the cloud the SITE_URL variable replaces them
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}
          ADDITIONAL_REDIRECT_URLS: ${{ vars.ADDITIONAL_REDIRECT_URLS }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "::error::Set the SITE_URL environment variable (the app address, https://…): without it the local site_url would reach the cloud"
            exit 1
          fi
          SUPABASE_AUTH_SITE_URL="$SITE_URL" SUPABASE_AUTH_ADDITIONAL_REDIRECT_URLS="${ADDITIONAL_REDIRECT_URLS:-$SITE_URL}" supabase config push --yes

name: Deploy database

# Миграции и настройки Auth из supabase/config.toml: main → staging, production → production (docs/release.md).
on:
  push:
    branches: [main, production]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-db.yml'
  workflow_dispatch: # повторить выкладку вручную (Actions → Deploy database → ветка main или production)

permissions:
  contents: read

concurrency:
  group: deploy-db-${{ github.ref_name }}
  cancel-in-progress: false # миграцию не обрываем на середине

jobs:
  deploy:
    name: Supabase ${{ github.ref_name == 'production' && 'production' || 'staging' }}
    # В самом шаблоне (репозиторий-шаблон) не запускается; в проекте — только из main и production.
    if: ${{ !github.event.repository.is_template && (github.ref_name == 'main' || github.ref_name == 'production') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Секреты и переменные — в GitHub Environment; у production обязательное подтверждение (required reviewers).
    environment: ${{ github.ref_name == 'production' && 'production' || 'staging' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Check environment secrets
        id: secrets
        run: |
          missing=""
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::warning::Выкладка базы пропущена: в окружении ${{ github.ref_name == 'production' && 'production' || 'staging' }} не заданы секреты:$missing (docs/release.md)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.secrets.outputs.ready == 'true'
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 2.119.0 # как в db.yml и на машинах разработчиков
      # Порт Postgres закрыт сетевыми ограничениями (SUPABASE_NETWORK_RESTRICTED=true): на время link и db push
      # к сохранённому списку добавляется IP раннера, потом список возвращается целиком (шаг ниже, if: always()).
      - name: Open the database port for this runner
        id: network
        if: steps.secrets.outputs.ready == 'true' && vars.SUPABASE_NETWORK_RESTRICTED == 'true'
        run: |
          saved="$RUNNER_TEMP/network-restrictions.json"
          supabase network-restrictions get --project-ref "$SUPABASE_PROJECT_REF" --experimental -o json > "$saved"
          jq -e '.config | type == "object"' "$saved" > /dev/null
          if jq -e '.status != "applied" and ([.config.dbAllowedCidrs[]?, .config.dbAllowedCidrsV6[]?] | length == 0)' "$saved" > /dev/null; then
            echo "::notice::Сетевые ограничения не применены: порт базы и так открыт"
            exit 0
          fi
          runner_ip=$(curl -fsS https://api.ipify.org)
          if ! [[ "$runner_ip" =~ ^[0-9]{1,3}(\.[0-9]{1,3}){3}$ ]]; then
            echo "::error::Не удалось узнать IPv4 раннера"
            exit 1
          fi
          echo "opened=true" >> "$GITHUB_OUTPUT"
          supabase network-restrictions update --project-ref "$SUPABASE_PROJECT_REF" --db-allow-cidr "$runner_ip/32" --append --experimental --yes
          for _ in $(seq 1 30); do
            supabase network-restrictions get --project-ref "$SUPABASE_PROJECT_REF" --experimental -o json | jq -e '.status == "applied"' > /dev/null && exit 0
            sleep 2
          done
          echo "::error::Supabase не применил временное правило за минуту"
          exit 1
      - name: Link project
        if: steps.secrets.outputs.ready == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Apply migrations
        if: steps.secrets.outputs.ready == 'true'
        run: supabase db push --yes
      # Возврат ровно сохранённого списка (замена, не добавление) через Management API: update в CLI 2.119
      # требует хотя бы один --db-allow-cidr и не умеет вернуть пустой список («Restrict all access»).
      - name: Restore network restrictions
        if: always() && steps.network.outputs.opened == 'true'
        run: |
          saved="$RUNNER_TEMP/network-restrictions.json"
          body=$(jq -c '{dbAllowedCidrs: (.config.dbAllowedCidrs // []), dbAllowedCidrsV6: (.config.dbAllowedCidrsV6 // [])}' "$saved")
          curl -fsS -X POST "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/network-restrictions/apply" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' \
            -d "$body" > "$RUNNER_TEMP/network-restrictions-restored.json"
          if ! jq -e --slurpfile saved "$saved" \
            '[.config.dbAllowedCidrs, .config.dbAllowedCidrsV6 | . // [] | sort] == [$saved[0].config.dbAllowedCidrs, $saved[0].config.dbAllowedCidrsV6 | . // [] | sort]' \
            "$RUNNER_TEMP/network-restrictions-restored.json" > /dev/null; then
            echo "::error::Список сетевых ограничений не совпал с сохранённым: проверьте Database → Network Restrictions"
            exit 1
          fi
          echo "Сетевые ограничения восстановлены"
      - name: Push Auth and API settings
        if: steps.secrets.outputs.ready == 'true'
        # site_url и адреса возврата в config.toml — локальные; для облака их подменяет переменная окружения SITE_URL
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "::error::Задайте переменную SITE_URL в окружении (адрес приложения, https://…): без неё в облако ушёл бы локальный site_url"
            exit 1
          fi
          SUPABASE_AUTH_SITE_URL="$SITE_URL" SUPABASE_AUTH_ADDITIONAL_REDIRECT_URLS="$SITE_URL" supabase config push --yes
